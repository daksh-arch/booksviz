<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Flow Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Water Flow Dashboard</h1>

    <h2>Nodes</h2>
    <div class="filter-container">
        <input type="text" id="node-filter" placeholder="Filter nodes...">
    </div>
    <div id="node-table-container">
        <!-- Node table will be rendered here by JavaScript -->
    </div>

    <h2>Flows</h2>
    <div class="filter-container">
        <input type="text" id="flow-filter" placeholder="Filter flows...">
    </div>
    <div id="flow-table-container">
        <!-- Flow table will be rendered here by JavaScript -->
    </div>

    <script src="script.js"></script>
</body>
</html>
